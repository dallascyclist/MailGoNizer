services:
  dovecot-slash:
    image: dovecot/dovecot:2.3.21
    ports:
      # Bound to loopback only: this server takes any username with a fixed
      # password over plaintext auth (see dovecot-slash.conf's static
      # passdb) -- it must never be reachable from the network.
      - "127.0.0.1:10143:143"
    volumes:
      - ./dovecot-slash.conf:/etc/dovecot/dovecot.conf:ro

  dovecot-dot:
    image: dovecot/dovecot:2.3.21
    ports:
      - "127.0.0.1:10144:143"
    volumes:
      - ./dovecot-dot.conf:/etc/dovecot/dovecot.conf:ro
