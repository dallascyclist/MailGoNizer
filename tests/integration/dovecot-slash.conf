protocols = imap
listen = *
ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login
mail_location = maildir:/srv/mail/%u/Maildir
log_path = /dev/stdout
namespace inbox {
  inbox = yes
  separator = /
}
passdb {
  driver = static
  args = password=testpass allow_nets=0.0.0.0/0
}
userdb {
  driver = static
  args = uid=1000 gid=1000 home=/srv/mail/%u
}
