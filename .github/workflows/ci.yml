name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Must stay inside pyproject.toml's `requires-python = ">=3.11,<3.14"`.
          # Python 3.14 turned imaplib.IMAP4.file into a read-only property;
          # IMAPClient 3.1.0 still assigns self.file directly during
          # IMAP4WithTimeout.open(), so every connection fails under 3.14
          # before login is ever attempted. 3.13 is what local development
          # uses (./venv/bin/python).
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - name: Guard against non-PEEK BODY fetches
        run: make check-peek
      - name: Lint (includes no-blind-except rule)
        run: ruff check lib tests
      - name: Unit tests
        run: pytest -v

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: docker compose -f tests/integration/docker-compose.yml up -d
      - name: Wait for Dovecot
        run: |
          # A bare TCP connect can succeed slightly before Dovecot's
          # imap-login process is ready to speak, so wait for the actual
          # "* OK" greeting rather than just a successful connection
          # (mirrors `make integration-up`).
          for i in $(seq 1 30); do
            if nc -w 1 localhost 10143 </dev/null 2>/dev/null | grep -q '^\* OK' && \
               nc -w 1 localhost 10144 </dev/null 2>/dev/null | grep -q '^\* OK'; then
              exit 0
            fi
            sleep 1
          done
          echo "dovecot did not come up" >&2
          exit 1
      - run: pytest -m integration -v
